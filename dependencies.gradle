/*
 * 附属（mcphone_wiki）依赖说明：
 *  - mcphone：编译期需要 api/IPhoneApp、api/PhoneApi、client/scene/PhoneUi。
 *    用 mcphone-v1.0.3-beta.3-dev.jar（361 774 B，与运行期 mcphone v1.0.3-beta.3
 *    基线一致，S0-6 依赖刷新）；仍用 compileOnly——运行时由实例 mods 里的
 *    mcphone 发布 jar 提供。
 *  - Qz-UILib：PhoneUi 场景树底层框架（qz_uilib-dev.jar，4.10.0，来自
 *    /home/c/c/mcphone-gtnh/libs/qz_uilib-dev.jar，与运行期版本对齐），同样
 *    compileOnly（运行时由实例 mods 里的 qz_uilib-4.10.0.jar 提供）。
 *  - MCEF：全程反射调用（技术红线），不进编译期依赖。
 *    不依赖 WebDisplays：页面由 modern MCEF 内嵌 Chromium 离屏渲染到全屏虚拟界面
 *    （modern 内核由 mcphone-addon-browser jar 内嵌提供）。
 */
dependencies {
    compileOnly(files(new File(rootDir, "libs/mcphone-v1.0.3-beta.3-dev.jar").absolutePath))
    compileOnly(files(new File(rootDir, "libs/qz_uilib-dev.jar").absolutePath))
}
